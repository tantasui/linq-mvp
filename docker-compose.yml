services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:latest
    command: -js --http_port 8222
    ports:
      - "4222:4222"
      - "8222:8222"  # NATS monitoring UI

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  consul:
    image: hashicorp/consul:1.20
    command: "agent -server -ui -node=server-1 -bootstrap-expect=1 -client=0.0.0.0"
    ports:
      - "8500:8500"
    healthcheck:
      test: ["CMD", "consul", "operator", "raft", "list-peers"]
      interval: 5s
      timeout: 3s
      retries: 10

  # TigerBeetle: format on first run, then start.
  # We use a wrapper image with a shell to handle the one-time format step.
  tigerbeetle:
    image: ghcr.io/tigerbeetle/tigerbeetle
    entrypoint: []
    command: >
      sh -c "
        [ -f /data/0_0.tigerbeetle ] || tigerbeetle format --cluster=0 --replica=0 --replica-count=1 /data/0_0.tigerbeetle
        && tigerbeetle start --addresses=0.0.0.0:3001 /data/0_0.tigerbeetle
      "
    ports:
      - "3001:3001"
    volumes:
      - tb_data:/data
    restart: unless-stopped

  # The multichain indexer binary — mount your built binary here.
  # Build: cd ../multichain-indexer && go build -o ./bin/indexer ./cmd/indexer/
  indexer:
    image: golang:1.25-bookworm
    working_dir: /app
    volumes:
      - ../multichain-indexer:/app
      - ./configs/indexer.yaml:/app/configs/config.yaml
    command: go run ./cmd/indexer/ --config configs/config.yaml
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_healthy
    environment:
      - CGO_ENABLED=0
    restart: unless-stopped

  # The MVP backend
  server:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/postgres
      - NATS_URL=nats://nats:4222
      - TIGERBEETLE_ADDR=tigerbeetle:3001
      - PORT=8080
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./migrations:/app/migrations

volumes:
  pg_data:
  tb_data:
