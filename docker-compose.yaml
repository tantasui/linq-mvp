services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - TIGERBEETLE_ADDR=${TIGERBEETLE_ADDR}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - MVP_PUBLIC_URL=${MVP_PUBLIC_URL}
      - PORT=${PORT:-8080}
    security_opt:
      - seccomp:unconfined
    restart: unless-stopped
    networks:
      - dokploy-network
    expose:
      - "8080"

networks:
  dokploy-network:
    external: true