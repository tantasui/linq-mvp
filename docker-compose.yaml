services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - TIGERBEETLE_ADDR=${TIGERBEETLE_ADDR}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - MVP_PUBLIC_URL=${MVP_PUBLIC_URL}
      - PORT=${PORT:-8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - seccomp:unconfined
    privileged: true
    restart: unless-stopped
